name: Release Multi-Platform Bundles

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            os_name: windows-x64
            rust_target: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            os_name: linux-x64
            rust_target: x86_64-unknown-linux-gnu
          - platform: macos-latest
            os_name: macos-arm64
            rust_target: aarch64-apple-darwin
          - platform: macos-latest
            os_name: macos-x64
            rust_target: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies (WebKit2GTK 4.1)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Provision Code Signing Certificate
        if: matrix.platform == 'windows-latest' && secrets.WINDOWS_CERTIFICATE_BASE64 != ''
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certDir = Join-Path $HOME ".code-signing"
          if (-not (Test-Path $certDir)) { New-Item -ItemType Directory -Force -Path $certDir | Out-Null }
          $pfxPath = Join-Path $certDir "code-signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          @{ Password = $env:WINDOWS_CERTIFICATE_PASSWORD } | ConvertTo-Json | Out-File (Join-Path $certDir "credentials.json") -Encoding utf8
          Write-Host "[OK] Code signing certificate successfully provisioned in CI environment." -ForegroundColor Green

      - name: Build Tauri application (Portable + Native Installers)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Rust File Manager v__VERSION__"
          releaseBody: "Cross-platform installers and portable binaries for Windows (.msi), Linux (.deb/.rpm/.AppImage), and macOS (.dmg/.app)."
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.rust_target }}
